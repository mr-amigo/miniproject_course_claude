name: review

on:
  pull_request:
    branches: [main]

jobs:
  show-todos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show current todo state
        run: |
          echo "Current TODO state:"
          python3 -m todo list --all
